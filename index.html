<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POND</title>
<style>
body{margin:0;font-family:ui-monospace,monospace;background:#080d08;color:#e8ffe8}
.wrap{max-width:720px;margin:auto;padding:20px}
h1{color:#7fff7f}
.card{background:#111a11;border:1px solid #1e331e;border-radius:16px;padding:14px;margin:10px 0}
.dim{color:#9bbf9b;font-size:13px}
pre{white-space:pre-wrap;background:#0a140a;padding:12px;border-radius:12px;border:1px solid #1e331e}
a{color:#7fff7f}
</style>
</head>
<body>
<div class="wrap">
<h1>POND</h1>
<div class="card dim">Single-process chain. Device holds live chain. Site is presentation.</div>
<div class="card"><pre id="live">loading live...</pre></div>
<div class="card"><pre>Files:
pond.py
pond.kernel.bin
chain.json
stamps/
keys/

Run:
nohup python pond.py > pond.log &

Check:
python health.py</pre></div>
<div class="card"><a href="https://github.com/dirlida/pond-embassy">github.com/dirlida/pond-embassy</a></div>
</div>
<script>
fetch('./live.json?'+Date.now()).then(r=>r.json()).then(d=>{
 document.getElementById('live').textContent =
 `LIVE ${d.HEAD} COUNT ${d.COUNT} KERNEL ${d.KERNEL}
mono ${d.mono}
time ${d.time}
stamps ${d.stamps} | log ${d.log_bytes}b`;
}).catch(()=>{document.getElementById('live').textContent='live.json not yet pushed - run health.py --json'});
</script>
</body>
</html>
