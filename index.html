<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1">
<title>POND Embassy</title>
<style>
body{margin:0;background:#0a0a0b;color:#e8e6e1;font-family:ui-monospace,Menlo,monospace;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.wrap{width:100%;max-width:520px}.card{background:#15151a;border:1px solid #24242f;border-radius:22px;padding:22px 20px}
.head{font-size:52px;font-weight:900;letter-spacing:-2px;color:#f5d36c;line-height:1}
.sub{margin-top:8px;font-size:13px;color:#9a9aa3}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.chip{background:#1c1c22;border:1px solid #2b2b36;border-radius:999px;padding:8px 13px;font-size:12px;color:#b8b8c0} .chip b{color:#fff;font-weight:700}
.live{margin-top:16px;background:#0f0f12;border:1px solid #222;border-radius:14px;padding:14px;font-size:11px;line-height:1.6;white-space:pre-wrap;color:#c8c8d0;max-height:420px;overflow:auto}
.ok{color:#4ade80;font-weight:800} .footer{margin-top:14px;font-size:11px;color:#555;text-align:center} a{color:#7afcff;text-decoration:none}
</style></head><body>
<div class=wrap><div class=card>
<div class=head>POND Embassy</div>
<div class=sub id=sub><span class=ok>● LIVE</span> • loading chain.json...</div>
<div class=row>
<span class=chip>Kernel <b id=k>a4c1a2285f33c07a</b></span>
<span class=chip>Drift <b>0.05 avg</b></span>
<span class=chip>Chain <b id=c>—</b></span>
</div>
<div class=row>
<span class=chip>Build <b id=b>177f5ef</b></span>
<span class=chip>Wall <b id=w>—</b></span>
<span class=chip>Boot <b id=up>—</b></span>
</div>
<div class=live id=live>Loading chain.json...</div>
</div>
<div class=footer>pond-embassy • a4c1a2285f33c07a • <a href="chain.json">chain.json</a> • <a href="live.json">live.json</a> • <a href="https://github.com/dirlida/pond-embassy">git</a></div>
</div>
<script>
async function load(){
 try{
  let [lv,chj]=await Promise.all([
   fetch('live.json?v='+Date.now()).then(r=>r.json()).catch(()=>null),
   fetch('chain.json?v='+Date.now()).then(r=>r.json()).catch(()=>[])
  ]);
  let last = Array.isArray(chj) ? chj[chj.length-1] : chj;
  if(last){
   document.getElementById('sub').innerHTML=`<span class=ok>● LIVE</span> • LIVE ${last.LIVE} COUNT ${last.COUNT} • ${last.TS}`;
   document.getElementById('c').textContent=(Array.isArray(chj)?chj.length:1)+' kept';
   document.getElementById('w').textContent=(last.TS||'').slice(0,19);
   document.getElementById('k').textContent=last.HEAD||'a4c1a2285f33c07a';
  }
  if(lv){
   document.getElementById('b').textContent=lv.build||lv.BUILD||'177f5ef';
   document.getElementById('up').textContent=lv.uptime||'—';
  }
  let t=`LIVE ${last?last.LIVE:'—'} • HEAD ${last?last.HEAD:'—'}\n`;
  if(lv) t+=JSON.stringify(lv,null,2).slice(0,800)+"\n\n";
  t+=(Array.isArray(chj)?JSON.stringify(chj.slice(-3),null,2):JSON.stringify(chj,null,2)).slice(0,2000);
  document.getElementById('live').textContent=t;
 }catch(e){}
}
load(); setInterval(load,5000);
</script>
</body></html>
